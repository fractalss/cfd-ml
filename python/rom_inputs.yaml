# User-configurable parameters for ROM setup

rom_type: PCA-RBF     # PCA-RBF or ML
type_of_field: Eulerian # Lagrangian or Eulerian

field_variable: Particle volume fraction # Particle volume fraction, Time-average particle volume fraction etc.
user_parameter: 11 #Untrained parametric value
target_times: # times when you need the ROM snapshot output
  - 5.0
  - 10.0
  - 15.0

base_data_dir: /data3/sauravmitra/ML_CFD_PINN/BVR-Kuipers-ROM # base directory where all your training data is located


test_dir: Test_1 # Test directory (relative to base_data_dir)


rev_dirs: ["Rev1", "Rev2", "Rev3","Rev4","Rev5"] # Training directories and corresponding parametric values
param_mapping: #Directory and mapping of parametric values
  Rev1: 10
  Rev2: 8
  Rev3: 13
  Rev4: 9
  Rev5: 12

# Optional: Skip training if model is already available
skip_training: true